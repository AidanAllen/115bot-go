services:
  hi_115bot:
    # 用预编译二进制打包（离线友好）；若要在服务器上从源码构建，把下面两行改成 dockerfile: Dockerfile
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        # 要跑在 ARM 机器上就把它改成 115bot-linux-arm64 / 115bot-linux-armv7
        # （二进制由 scripts/build-all.sh 产出，放到 bin/ 下）
        BIN_NAME: ${BIN_NAME:-115bot-linux-amd64}
    image: hi_115bot:latest
    container_name: hi_115bot
    restart: unless-stopped
    env_file:
      - .env
    # 下面两处（uid 101 + tgdata 卷）**只为配合 telegram-bot-api 服务**：
    # 必须与它同 uid（镜像里 telegram-bot-api 用户是 101），
    # 否则读不到它落盘的文件、也删不掉用完的缓存（目录是 750）。
    # 不启用 localapi 的话它们可以去掉，但宿主 data/ 的属主得跟着改回
    # （之前为配合它做过 chown -R 101:101 data/ tgdata/）。
    user: "101:101"
    volumes:
      - ./data:/app/data
      # 与 telegram-bot-api 挂同一个卷、且容器路径必须一模一样：
      # 本地模式下 getFile 返回的是 telegram-bot-api 容器内的绝对路径，
      # 只有两边路径一致，bot 才能直接读到那个文件（省掉跨境下载）。
      - ./tgdata:/var/lib/telegram-bot-api
    # 内存硬约束：Go 进程常驻约 15-25MB，这里留足余量并防止异常膨胀
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选（v1.2.0 起已非必需）：Telegram 本地 Bot API 服务
  #
  # v1.2.0 起内置了 MTProto 下载（internal/tgfile），只需 TG_API_ID + TG_API_HASH
  # 就能下任意大小的文件，不需要 Docker、跨平台一致。所以**新部署不必再起这个容器**。
  #
  # 它的独占价值只剩两点，都不是刚需：
  #   1. --local 模式下文件落在 tgdata 卷里，bot 直接读盘，省一次「TG DC → 本机」的下载
  #      （注意：只有 bot 收到过、且被 tgdata 缓存住的文件才有这个待遇）；
  #   2. 上传侧支持 2000MB —— 本 bot 只往 115 传，不发文件回 Telegram，用不上。
  #
  # 代价却不少：必须 Docker；两个容器 uid 与卷路径要严格对齐（见 hi_115bot 的
  # user/volumes 注释）；tgdata 会持续增长要清理；镜像还可能漂（下面钉了 10.3）。
  #
  # 仍然想启用：把 .env 里的 TG_API_ENDPOINT 指向下面的地址，再
  #   docker compose --profile localapi up -d
  # 启用后下载优先级是「本地直读 > MTProto > 官方 HTTP」，MTProto 实际只当备胎。
  telegram-bot-api:
    # 固定 Bot API 版本，不要用 latest：
    #   latest 每次被重建都可能换掉 tdlib（Hub 上同一个 10.3 都重建过多次，
    #   实测 2026-10 一个月内至少两次），一旦 pull 到新版，行为和目录约定
    #   都可能变，而本项目的 Go 客户端是 go-telegram-bot-api v5.5.1（Bot API 5.x），
    #   跨版本差很大，出问题往往是「整条消息解析失败」这种静默故障。
    # 该 tag 是 multi-arch manifest，amd64/arm64 机器都直接写 10.3 即可；
    # 想钉到某一次具体构建就改成 @sha256:<digest>（见 README「升级本地 Bot API」）。
    # 升级前先备份 tgdata：tdlib 的库只升不降，换回旧镜像可能起不来。
    image: aiogram/telegram-bot-api:10.3
    container_name: hi_115bot-tgbotapi
    restart: unless-stopped
    profiles: ["localapi"]
    # 只绑回环：Windows 上跑 exe（不走 compose）时，宿主也要能访问这个文件端点，
    # 映射出来供 http://127.0.0.1:8081 使用；不绑到 0.0.0.0 是因为该端口无鉴权，
    # 谁访问到都能下载 bot 收到的文件。
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./tgdata:/var/lib/telegram-bot-api
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
