services:
  hi_115bot:
    # 用预编译二进制打包（离线友好）；若要在服务器上从源码构建，把下面两行改成 dockerfile: Dockerfile
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        # 要跑在 ARM 机器上就把它改成 115bot-linux-arm64 / 115bot-linux-armv7
        # （二进制由 scripts/build-all.sh 产出，放到 bin/ 下）
        BIN_NAME: ${BIN_NAME:-115bot-linux-amd64}
    image: hi_115bot:latest
    container_name: hi_115bot
    restart: unless-stopped
    env_file:
      - .env
    # 以 uid 101 运行（沿用旧部署的属主约定，避免 data/ 里的 SQLite 出权限问题）。
    # 新建目录后记得：mkdir -p data && chown -R 101:101 data
    user: "101:101"
    volumes:
      # 数据库（app_config / user_config / task）与 MTProto 会话都在这里
      - ./data:/app/data
    # 内存硬约束：Go 进程常驻约 15-25MB，这里留足余量并防止异常膨胀
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
