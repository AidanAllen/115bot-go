name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 tag（例 v1.1.0）
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            arm: ""
          - name: linux-arm64
            goos: linux
            goarch: arm64
            arm: ""
          - name: linux-armv7
            goos: linux
            goarch: arm
            arm: "7"
          - name: windows-amd64
            goos: windows
            goarch: amd64
            arm: ""
          - name: windows-arm64
            goos: windows
            goarch: arm64
            arm: ""
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            arm: ""
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            arm: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          OUT="115bot-${{ matrix.name }}$EXT"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/AidanAllen/115bot-go/internal/bot.Version=${{ steps.ver.outputs.version }} \
              -X github.com/AidanAllen/115bot-go/internal/bot.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$OUT" ./cmd/bot
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$OUT" "$OUT.sha256" --clobber

  # README 顶部的 release 徽章是**静态值**（形如 release-v1.0.1-blue），
  # 刻意不调 GitHub API：动态徽章在 API 限流/网络抖动时会裂图或显示
  # "no releases or repo not found"。代价是版本号需要同步，这个 job 负责自动跟上。
  sync-badge:
    name: Sync README release badge
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 徽章同步失败不该拖垮发版（产物已经上传完了）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 更新 README 静态 release 徽章到本 tag 版本
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # 只替换 release-vX.Y.Z 这一段，正文里出现的版本号一律不动
          sed -i -E "s|release-v[0-9]+\.[0-9]+\.[0-9]+|release-v${VERSION}|g" README.md
          if git diff --quiet -- README.md; then
            echo "README 徽章已是 v${VERSION}，无需提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 同步 README release 徽章到 v${VERSION}" -- README.md
          git push origin main
