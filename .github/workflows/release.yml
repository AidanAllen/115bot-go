name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 tag（例 v1.1.0）
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            arm: ""
          - name: linux-arm64
            goos: linux
            goarch: arm64
            arm: ""
          - name: linux-armv7
            goos: linux
            goarch: arm
            arm: "7"
          - name: windows-amd64
            goos: windows
            goarch: amd64
            arm: ""
          - name: windows-arm64
            goos: windows
            goarch: arm64
            arm: ""
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            arm: ""
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            arm: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          OUT="115bot-${{ matrix.name }}$EXT"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/AidanAllen/115bot-go/internal/bot.Version=${{ steps.ver.outputs.version }} \
              -X github.com/AidanAllen/115bot-go/internal/bot.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$OUT" ./cmd/bot
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$OUT" "$OUT.sha256" --clobber

  # README 顶部的徽章是仓库内自托管 SVG（docs/badges/），不依赖 shields.io：
  # 部分网络到 img.shields.io / github.com 间歇性超时，动态徽章还会因 API 限流
  # 裂图。代价是 release 版本号需要同步，这个 job 负责自动更新 release.svg
  # （SVG 里的版本文本共 3 处：aria-label / title / text；text 带 textLength，
  # 版本号变长时会自动压缩字形，无需调整宽度）。
  sync-badge:
    name: Sync release badge version
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 徽章同步失败不该拖垮发版（产物已经上传完了）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 更新 release.svg 的版本号到本 tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 只替换 SVG 内的 vX.Y.Z 文本，README 正文里的版本号一律不动
          sed -i -E "s|v[0-9]+\.[0-9]+\.[0-9]+|${TAG}|g" docs/badges/release.svg
          if git diff --quiet -- docs/badges/release.svg; then
            echo "release.svg 已是 ${TAG}，无需提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 同步 release 徽章到 ${TAG}" -- docs/badges/release.svg
          git push origin main
